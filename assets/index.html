<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Minesweeper</title>
<style>
:root{
  --bg:#0e1013; --cell:#1b1f26; --cell-p:#2a303b; --open:#13161b;
  --fg:#e6e8eb; --mut:#7d8590; --line:#262b33; --good:#4cc38a; --bad:#ef5b5b;
  --c:28px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg)}
body{
  font:15px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
button{font:inherit;color:inherit;outline:none;cursor:pointer}
#app{height:100%;max-width:560px;margin:0 auto;padding:8px 14px 12px;display:flex;flex-direction:column}

header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:64px}
.stat{display:flex;flex-direction:column;gap:5px}
.stat.r{align-items:flex-end}
.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.num{font:600 24px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;letter-spacing:.04em}

#restart{
  width:46px;height:46px;padding:0;border-radius:50%;
  border:1.5px solid var(--line);background:none;display:grid;place-items:center;
  transition:border-color .2s,color .2s,transform .1s;
}
#restart:active{transform:scale(.9)}
#restart.won{border-color:var(--good);color:var(--good)}
#restart.lost{border-color:var(--bad);color:var(--bad)}

main{flex:1 1 0;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center}
#board{display:grid;gap:3px;touch-action:none}
.cell{
  width:var(--c);height:var(--c);border-radius:calc(var(--c) * .22);
  background-color:var(--cell);display:grid;place-items:center;
  font-weight:700;line-height:1;transition:background-color .12s;
  background-repeat:no-repeat;background-position:center;background-size:62%;
}
.cell:active{background-color:var(--cell-p)}
.cell.o{background-color:var(--open)}
.cell.f{background-image:var(--flag)}
.cell.f.w{background-color:rgba(239,91,91,.28)}
.cell.m{background-image:var(--mine)}
.cell.o.x{background-color:var(--bad)}
.n1{color:#5aa9ff}.n2{color:#4cc38a}.n3{color:#ef6b6b}.n4{color:#b38bff}
.n5{color:#ffb454}.n6{color:#4fd1c5}.n7{color:#e6e8eb}.n8{color:#8b949e}

#msg{height:20px;margin:6px 0;text-align:center;font-size:13px;color:var(--mut);white-space:nowrap}
#msg.good{color:var(--good)}
#msg.bad{color:var(--bad)}

footer{display:flex;justify-content:space-between;gap:10px}
.seg{display:flex;gap:2px;padding:3px;border-radius:11px;background:#161a20}
.seg button{border:0;background:none;color:var(--mut);font-weight:600;font-size:13px;padding:10px 11px;border-radius:8px}
.seg button.on{background:#262c36;color:var(--fg)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="stat"><span class="lbl">Mines</span><span class="num" id="mines">010</span></div>
    <button id="restart" aria-label="New game">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>
    </button>
    <div class="stat r"><span class="lbl">Time</span><span class="num" id="time">000</span></div>
  </header>
  <main><div id="board" aria-label="Minefield"></div></main>
  <div id="msg"></div>
  <footer>
    <div class="seg" id="levels">
      <button data-level="easy">Easy</button><button data-level="medium">Medium</button><button data-level="hard">Hard</button>
    </div>
    <div class="seg" id="mode">
      <button data-mode="dig">Dig</button><button data-mode="flag">Flag</button>
    </div>
  </footer>
</div>
<script>
(() => {
'use strict';

const LEVELS = {
  easy:   { cols: 8,  rows: 10, mines: 10 },
  medium: { cols: 9,  rows: 13, mines: 20 },
  hard:   { cols: 10, rows: 16, mines: 32 }
};
const LONG_PRESS_MS = 360;

const $ = s => document.querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
const pad = (n, w) => String(n).padStart(w, '0');
const svgUrl = s => 'url("data:image/svg+xml,' + encodeURIComponent(s) + '")';

document.documentElement.style.setProperty('--flag', svgUrl(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">' +
  '<rect x="8" y="19" width="8" height="2" rx="1" fill="#cfd4da"/>' +
  '<rect x="11" y="4" width="2" height="16" rx="1" fill="#cfd4da"/>' +
  '<path d="M13 4.2 20.5 8 13 11.8z" fill="#ef5b5b"/></svg>'));
document.documentElement.style.setProperty('--mine', svgUrl(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">' +
  '<g stroke="#e6e8eb" stroke-width="2" stroke-linecap="round">' +
  '<path d="M12 3.5v3M12 17.5v3M3.5 12h3M17.5 12h3M6 6l2.1 2.1M15.9 15.9 18 18M18 6l-2.1 2.1M8.1 15.9 6 18"/></g>' +
  '<circle cx="12" cy="12" r="5.2" fill="#e6e8eb"/>' +
  '<circle cx="10.3" cy="10.3" r="1.5" fill="#0e1013" opacity=".35"/></svg>'));

const el = {
  board: $('#board'), main: $('main'), mines: $('#mines'), time: $('#time'),
  restart: $('#restart'), msg: $('#msg'), levels: $('#levels'), mode: $('#mode')
};

let level = store.get('ms-level', 'easy');
if (!LEVELS[level]) level = 'easy';
let flagMode = false;
let g = null;          // current game
let cells = [];        // cell elements
let timerId = 0;
let hiddenAt = 0;
let press = null;

/* ---------- game logic ---------- */

function neighbors(cols, rows) {
  const out = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const list = [];
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      const rr = r + dr, cc = c + dc;
      if (rr >= 0 && rr < rows && cc >= 0 && cc < cols) list.push(rr * cols + cc);
    }
    out.push(list);
  }
  return out;
}

function newGame() {
  stopTimer();
  const L = LEVELS[level], n = L.cols * L.rows;
  g = {
    cols: L.cols, rows: L.rows, mines: L.mines, n,
    mine: new Uint8Array(n), adj: new Uint8Array(n),
    st: new Uint8Array(n),            // 0 hidden, 1 open, 2 flag
    nb: neighbors(L.cols, L.rows),
    status: 'ready',                  // ready | playing | won | lost
    open: 0, flags: 0, t0: 0, end: 0, boom: -1, secs: 0, newBest: false, prevBest: 0
  };
  const frag = document.createDocumentFragment();
  cells = [];
  for (let i = 0; i < n; i++) {
    const d = document.createElement('div');
    d.className = 'cell';
    d.dataset.i = i;
    cells.push(d);
    frag.appendChild(d);
  }
  el.board.textContent = '';
  el.board.appendChild(frag);
  el.restart.className = '';
  fit();
  updateCounter();
  tick();
  setMsg();
}

function placeMines(first) {
  const safe = new Set([first, ...g.nb[first]]);
  let pool = [];
  for (let i = 0; i < g.n; i++) if (!safe.has(i)) pool.push(i);
  if (pool.length < g.mines) {            // tiny boards: only protect the tapped cell
    pool = [];
    for (let i = 0; i < g.n; i++) if (i !== first) pool.push(i);
  }
  for (let k = 0; k < g.mines; k++) {
    const r = k + Math.floor(Math.random() * (pool.length - k));
    const t = pool[k]; pool[k] = pool[r]; pool[r] = t;
    g.mine[pool[k]] = 1;
  }
  for (let i = 0; i < g.n; i++) {
    let a = 0;
    for (const j of g.nb[i]) a += g.mine[j];
    g.adj[i] = a;
  }
}

function flood(start) {
  const stack = [start];
  while (stack.length) {
    const k = stack.pop();
    if (g.st[k] !== 0) continue;
    g.st[k] = 1; g.open++; paint(k);
    if (g.adj[k] === 0) for (const j of g.nb[k]) if (g.st[j] === 0) stack.push(j);
  }
}

function dig(i) {
  if (g.status === 'won' || g.status === 'lost' || g.st[i] !== 0) return;
  if (g.status === 'ready') {
    placeMines(i);
    g.status = 'playing';
    g.t0 = Date.now();
    timerId = setInterval(tick, 250);
    setMsg();
  }
  if (g.mine[i]) { lose(i); return; }
  flood(i);
  checkWin();
}

function toggleFlag(i) {
  if (g.status === 'won' || g.status === 'lost' || g.st[i] === 1) return;
  if (g.st[i] === 2) { g.st[i] = 0; g.flags--; } else { g.st[i] = 2; g.flags++; }
  paint(i);
  updateCounter();
}

function chord(i) {
  if (g.status !== 'playing' || g.st[i] !== 1 || g.adj[i] === 0) return;
  let f = 0;
  for (const j of g.nb[i]) if (g.st[j] === 2) f++;
  if (f !== g.adj[i]) return;
  for (const j of g.nb[i]) {
    if (g.st[j] !== 0) continue;
    if (g.mine[j]) { lose(j); return; }
    flood(j);
  }
  checkWin();
}

function checkWin() {
  if (g.status === 'playing' && g.open === g.n - g.mines) win();
}

function lose(i) {
  g.status = 'lost';
  g.boom = i;
  stopTimer();
  refreshAll();
  el.restart.className = 'lost';
  setMsg();
}

function win() {
  g.status = 'won';
  stopTimer();
  for (let i = 0; i < g.n; i++) if (g.mine[i] && g.st[i] === 0) { g.st[i] = 2; g.flags++; }
  g.secs = Math.max(1, elapsed());
  const key = 'ms-best-' + level;
  g.prevBest = +store.get(key, 0) || 0;
  g.newBest = !g.prevBest || g.secs < g.prevBest;
  if (g.newBest) store.set(key, String(g.secs));
  refreshAll();
  el.restart.className = 'won';
  setMsg();
}

/* ---------- timer ---------- */

function elapsed() {
  if (!g.t0) return 0;
  return Math.min(999, Math.floor(((g.end || Date.now()) - g.t0) / 1000));
}
function stopTimer() {
  if (timerId) { clearInterval(timerId); timerId = 0; }
  if (g && g.t0 && !g.end) g.end = Date.now();
  if (g) tick();
}
function tick() { el.time.textContent = pad(elapsed(), 3); }

document.addEventListener('visibilitychange', () => {
  if (!g || g.status !== 'playing') return;
  if (document.hidden) hiddenAt = Date.now();
  else if (hiddenAt) { g.t0 += Date.now() - hiddenAt; hiddenAt = 0; tick(); }
});

/* ---------- rendering ---------- */

function paint(i) {
  const c = cells[i], s = g.st[i], lost = g.status === 'lost';
  let cls = 'cell', txt = '';
  if (s === 1) {
    cls += ' o';
    if (g.adj[i]) { cls += ' n' + g.adj[i]; txt = String(g.adj[i]); }
  } else if (s === 2) {
    cls += ' f';
    if (lost && !g.mine[i]) cls += ' w';
  } else if (lost && g.mine[i]) {
    cls += ' o m';
    if (i === g.boom) cls += ' x';
  }
  if (c.className !== cls) c.className = cls;
  if (c.textContent !== txt) c.textContent = txt;
}

function refreshAll() {
  for (let i = 0; i < g.n; i++) paint(i);
  updateCounter();
}

function updateCounter() {
  const left = g.mines - g.flags;
  el.mines.textContent = left < 0 ? '-' + pad(-left, 2) : pad(left, 3);
}

function setMsg() {
  let t = '', c = '';
  if (g.status === 'won') {
    t = g.newBest ? `Cleared in ${g.secs}s · new best` : `Cleared in ${g.secs}s · best ${g.prevBest}s`;
    c = 'good';
  } else if (g.status === 'lost') {
    t = 'Boom. Tap restart to try again';
    c = 'bad';
  } else if (g.status === 'ready') {
    t = flagMode ? 'Tap to flag · hold to dig' : 'Tap to dig · hold to flag';
  } else {
    const b = +store.get('ms-best-' + level, 0) || 0;
    t = b ? `Best ${b}s` : '';
  }
  el.msg.textContent = t;
  el.msg.className = c;
}

function fit() {
  if (!g) return;
  const gap = 3;
  const w = el.main.clientWidth, h = el.main.clientHeight;
  let c = Math.floor(Math.min((w - gap * (g.cols - 1)) / g.cols, (h - gap * (g.rows - 1)) / g.rows));
  c = Math.max(14, Math.min(c, 52));
  el.board.style.setProperty('--c', c + 'px');
  el.board.style.gridTemplateColumns = `repeat(${g.cols}, ${c}px)`;
  el.board.style.fontSize = Math.round(c * 0.56) + 'px';
}

function syncControls() {
  for (const b of el.levels.children) b.classList.toggle('on', b.dataset.level === level);
  for (const b of el.mode.children) b.classList.toggle('on', (b.dataset.mode === 'flag') === flagMode);
}

/* ---------- input ---------- */

function act(i, alt) {
  if (g.st[i] === 1) { chord(i); return; }
  if (alt ? !flagMode : flagMode) toggleFlag(i); else dig(i);
}

el.board.addEventListener('pointerdown', e => {
  if (press) return;
  const cell = e.target.closest ? e.target.closest('.cell') : null;
  if (!cell) return;
  const i = +cell.dataset.i;
  if (e.pointerType === 'mouse' && e.button === 2) { act(i, true); return; }
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const p = { i, x: e.clientX, y: e.clientY, long: false, t: 0 };
  p.t = setTimeout(() => { p.long = true; act(i, true); }, LONG_PRESS_MS);
  press = p;
});
el.board.addEventListener('pointermove', e => {
  if (press && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 14) {
    clearTimeout(press.t); press = null;
  }
});
el.board.addEventListener('pointerup', () => {
  if (!press) return;
  const p = press; press = null;
  clearTimeout(p.t);
  if (!p.long) act(p.i, false);
});
el.board.addEventListener('pointercancel', () => {
  if (press) { clearTimeout(press.t); press = null; }
});
document.addEventListener('contextmenu', e => e.preventDefault());

el.restart.addEventListener('click', newGame);
el.levels.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  level = b.dataset.level;
  store.set('ms-level', level);
  syncControls();
  newGame();
});
el.mode.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  flagMode = b.dataset.mode === 'flag';
  syncControls();
  if (g.status === 'ready') setMsg();
});

window.addEventListener('resize', fit);
if (window.ResizeObserver) new ResizeObserver(fit).observe(el.main);

syncControls();
newGame();
/*__HOOK__*/
})();
</script>
</body>
</html>
